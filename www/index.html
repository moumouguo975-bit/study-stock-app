<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>学财助手</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --sub: #6b7280;
      --up: #ef4444;
      --down: #10b981;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 76px;
    }
    header {
      position: sticky; top: 0; z-index: 20;
      background: var(--primary); color: #fff;
      padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 8px rgba(79,70,229,0.25);
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .hdr-btn {
      background: rgba(255,255,255,0.2); border: none; color: #fff;
      padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;
    }
    .page { display: none; padding: 12px; max-width: 720px; margin: 0 auto; }
    .page.active { display: block; }
    .card {
      background: var(--card); border-radius: 14px; padding: 14px;
      margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .card-title { font-size: 15px; font-weight: 600; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-full { grid-column: 1 / -1; }
    input, select, textarea {
      width: 100%; padding: 9px 10px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; background: #fff; color: var(--text);
    }
    textarea { resize: vertical; min-height: 70px; }
    .btn {
      background: var(--primary); color: #fff; border: none; border-radius: 8px;
      padding: 10px 14px; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-outline { background: var(--primary-light); color: var(--primary); }
    .btn-warn { background: #fef3c7; color: #b45309; }
    .btn-danger { background: #fee2e2; color: #dc2626; }
    .day-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
    .day-pill {
      flex: 0 0 auto; padding: 6px 12px; border-radius: 20px;
      background: #e5e7eb; color: #374151; font-size: 13px; border: none; cursor: pointer;
    }
    .day-pill.active { background: var(--primary); color: #fff; }
    .item-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 10px 0; border-bottom: 1px solid var(--border); gap: 8px;
    }
    .item-row:last-child { border-bottom: none; }
    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 6px;
      font-size: 11px; background: var(--primary-light); color: var(--primary); margin-right: 4px;
    }
    .badge-alarm { background: #fef3c7; color: #b45309; }
    .badge-urgent { background: #fee2e2; color: #b91c1c; }
    .sub-text { font-size: 12px; color: var(--sub); margin-top: 3px; line-height: 1.45; }

    /* 股市卡片 & 走势图 */
    .idx-scroll { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .idx-box {
      background: #f9fafb; border: 1px solid var(--border); border-radius: 10px; padding: 10px;
      cursor: pointer;
    }
    .up { color: var(--up); font-weight: 600; }
    .down { color: var(--down); font-weight: 600; }
    .spark-wrap { width: 100%; height: 42px; margin-top: 4px; }
    .news-box {
      margin-top: 8px; padding: 10px; background: #f8fafc;
      border-radius: 8px; border-left: 3px solid var(--primary); font-size: 12px;
    }
    .news-link {
      display: block; color: #1f2937; text-decoration: none;
      padding: 5px 0; border-bottom: 1px dashed #e2e8f0;
    }
    .news-link:last-child { border-bottom: none; }
    .search-row { display: flex; gap: 8px; margin-bottom: 10px; }

    /* 音乐播放器 */
    .ambient-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .ambient-btn {
      padding: 14px 10px; border-radius: 12px; border: 1px solid var(--border);
      background: #f9fafb; font-size: 14px; text-align: center; cursor: pointer;
    }
    .ambient-btn.playing { background: var(--primary-light); border-color: var(--primary); color: var(--primary); font-weight: 600; }
    .player-panel {
      background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px;
    }
    .player-controls { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 10px; }
    .time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); }

    /* 文件与弹窗 */
    .thumb { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
    .modal {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.75); justify-content: center; align-items: center; padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-body {
      background: #fff; border-radius: 14px; padding: 16px;
      width: 100%; max-width: 560px; max-height: 85vh; overflow: auto;
    }

    /* 全屏闹钟响铃界面 */
    #ringingOverlay {
      display: none; position: fixed; inset: 0; z-index: 999;
      background: linear-gradient(160deg, #dc2626, #7c2d12);
      color: #fff; flex-direction: column; justify-content: center; align-items: center;
      padding: 24px; text-align: center;
    }
    #ringingOverlay.active { display: flex; }
    .ring-icon { font-size: 72px; animation: shake 0.4s infinite; }
    @keyframes shake {
      0%,100% { transform: rotate(0deg); }
      25% { transform: rotate(-16deg); }
      75% { transform: rotate(16deg); }
    }

    /* 底部导航 */
    nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
      background: #fff; border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center; z-index: 30;
    }
    nav button {
      background: none; border: none; color: var(--sub);
      display: flex; flex-direction: column; align-items: center;
      font-size: 11px; gap: 3px; cursor: pointer; padding: 6px 10px;
    }
    nav button.active { color: var(--primary); font-weight: 600; }
    nav button span.ico { font-size: 20px; }
  </style>
</head>
<body>
  <header>
    <h1 id="headerTitle">📅 我的课表</h1>
    <button class="hdr-btn" id="testAlarmBtn">⏰ 测试响铃闹钟</button>
  </header>

  <!-- 1. 课表页 -->
  <section id="page-schedule" class="page active">
    <div class="card">
      <div class="card-title">
        <span>添加课程</span>
        <button class="btn btn-sm btn-outline" id="openBatchCourseBtn">📋 批量导入</button>
      </div>
      <div class="form-grid">
        <input id="cName" placeholder="课程名称 (如: 高等数学)" class="form-full" />
        <select id="cDay">
          <option value="1">周一</option><option value="2">周二</option>
          <option value="3">周三</option><option value="4">周四</option>
          <option value="5">周五</option><option value="6">周六</option>
          <option value="0">周日</option>
        </select>
        <input id="cRoom" placeholder="教室/地点 (如: 教A-201)" />
        <input id="cStart" type="time" value="08:00" />
        <input id="cEnd" type="time" value="09:40" />
        <select id="cAdvance">
          <option value="15">提前15分钟响铃</option>
          <option value="30">提前30分钟响铃</option>
          <option value="10">提前10分钟响铃</option>
          <option value="5">提前5分钟响铃</option>
          <option value="0">准点响铃</option>
        </select>
        <select id="cMode">
          <option value="alarm">⏰ 响铃闹钟 (强提醒)</option>
          <option value="normal">🔔 普通通知</option>
        </select>
        <button class="btn form-full" id="addCourseBtn">保存课程并设置每周闹钟</button>
      </div>
    </div>

    <div class="card">
      <div class="day-tabs" id="dayTabs"></div>
      <div id="courseList"></div>
    </div>
  </section>

  <!-- 2. 考试计划页 -->
  <section id="page-exams" class="page">
    <div class="card">
      <div class="card-title">添加考试计划</div>
      <div class="form-grid">
        <input id="eName" placeholder="考试科目 (如: 线性代数期末)" class="form-full" />
        <input id="eDateTime" type="datetime-local" class="form-full" />
        <input id="eRoom" placeholder="考场/座位号" />
        <select id="eAdvance">
          <option value="1440">提前1天响铃</option>
          <option value="120">提前2小时响铃</option>
          <option value="60">提前1小时响铃</option>
          <option value="30">提前30分钟响铃</option>
          <option value="0">准点响铃</option>
        </select>
        <select id="eMode">
          <option value="alarm">⏰ 响铃闹钟</option>
          <option value="normal">🔔 普通通知</option>
        </select>
        <input id="eNote" placeholder="复习重点 / 携带物品备注" />
        <button class="btn form-full" id="addExamBtn">保存考试计划并设闹钟</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">考试倒计时清单</div>
      <div id="examList"></div>
    </div>
  </section>

  <!-- 3. 文件/图文资料库 -->
  <section id="page-files" class="page">
    <div class="card">
      <div class="card-title">导入图片 / 文字 / 常见文件</div>
      <div class="sub-text" style="margin-bottom:10px;">
        支持图片、TXT/CSV、PDF、Word、Excel、PPT，自动转为本地离线数据保存。
      </div>
      <div class="form-grid">
        <label class="btn" style="text-align:center;">
          📁 导入图片/文件
          <input type="file" id="fileUploadInput" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.md,.csv,*/*" style="display:none;" />
        </label>
        <button class="btn btn-outline" id="openNoteModalBtn">📝 新建文字笔记</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">
        <span>我的本地资料库</span>
        <select id="fileFilter" style="width:auto; padding:4px 8px; font-size:12px;">
          <option value="all">全部类型</option>
          <option value="image">图片</option>
          <option value="text">文字/笔记</option>
          <option value="doc">文档/PDF/表格</option>
        </select>
      </div>
      <div id="fileList"></div>
    </div>
  </section>

  <!-- 4. 放松音乐页 -->
  <section id="page-music" class="page">
    <div class="card">
      <div class="card-title">
        <span>🌿 内置助眠/专注白噪音</span>
        <select id="sleepTimer" style="width:auto; padding:4px 8px; font-size:12px;">
          <option value="0">不定时</option>
          <option value="15">15分钟关闭</option>
          <option value="30">30分钟关闭</option>
          <option value="60">60分钟关闭</option>
        </select>
      </div>
      <div class="ambient-grid">
        <button class="ambient-btn" data-sound="rain">🌧️ 窗外雨声</button>
        <button class="ambient-btn" data-sound="ocean">🌊 温柔海浪</button>
        <button class="ambient-btn" data-sound="fire">🔥 温暖篝火</button>
        <button class="ambient-btn" data-sound="alpha">🎹 轻柔脑波和弦</button>
      </div>
      <div style="margin-top:12px; display:flex; align-items:center; gap:10px;">
        <span style="font-size:12px; white-space:nowrap;">音量</span>
        <input type="range" id="ambientVol" min="0" max="1" step="0.05" value="0.5" />
        <button class="btn btn-sm btn-danger" id="stopAmbientBtn" style="white-space:nowrap;">停止</button>
      </div>
      <div id="timerStatus" class="sub-text"></div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>🎧 本地音乐播放器</span>
        <label class="btn btn-sm btn-outline">
          + 导入音乐
          <input type="file" id="musicUploadInput" multiple accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.aac" style="display:none;" />
        </label>
      </div>
      <div class="player-panel">
        <div id="nowPlaying" style="font-weight:600; font-size:14px; margin-bottom:8px; word-break:break-all;">未选择曲目</div>
        <input type="range" id="musicSeek" min="0" max="100" value="0" step="0.1" />
        <div class="time-row">
          <span id="curTime">00:00</span>
          <span id="durTime">00:00</span>
        </div>
        <div class="player-controls">
          <button class="btn btn-sm btn-outline" id="prevTrackBtn">⏮ 上一首</button>
          <button class="btn btn-sm" id="playPauseBtn">▶️ 播放</button>
          <button class="btn btn-sm btn-outline" id="nextTrackBtn">⏭ 下一首</button>
        </div>
        <audio id="audioPlayer" preload="metadata"></audio>
      </div>
      <div id="trackList"></div>
    </div>
  </section>

  <!-- 5. 全球股市与每日消息汇总 -->
  <section id="page-stocks" class="page">
    <div class="card">
      <div class="card-title">
        <span>🌍 全球大盘指数 (点击看30日态势)</span>
        <div>
          <button class="btn btn-sm btn-outline" id="refreshStocksBtn">🔄 刷新</button>
          <button class="btn btn-sm btn-outline" id="configRepoBtn">⚙️</button>
        </div>
      </div>
      <div id="stockUpdated" class="sub-text" style="margin-bottom:8px;">正在同步全球股市...</div>
      <div class="day-tabs" id="regionTabs">
        <button class="day-pill active" data-region="all">全球全部</button>
        <button class="day-pill" data-region="美洲">美洲</button>
        <button class="day-pill" data-region="亚太">亚太(A/港/日韩)</button>
        <button class="day-pill" data-region="欧洲">欧洲</button>
      </div>
      <div id="indicesGrid" class="idx-scroll"></div>
    </div>

    <div class="card">
      <div class="card-title">📰 每日全球财经头条汇总</div>
      <div id="globalNewsList"></div>
    </div>

    <div class="card">
      <div class="card-title">📈 全网搜股 & 个股态势图 / 每日消息</div>
      <div class="search-row">
        <input id="stockSearch" placeholder="输股票代码/名称(如 BABA、茅台、TSLA、BTC)..." />
        <button class="btn btn-sm" id="liveSearchBtn" style="white-space:nowrap;">🔍 全网搜</button>
      </div>
      <div id="liveSearchResult"></div>
      <div id="stocksList"></div>
    </div>
  </section>

  <!-- 通用弹窗 -->
  <div id="modal" class="modal">
    <div class="modal-body">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <strong id="modalTitle">详情</strong>
        <button class="btn btn-sm btn-danger" id="closeModalBtn">关闭</button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- 全屏响铃闹钟界面 -->
  <div id="ringingOverlay">
    <div class="ring-icon">⏰</div>
    <h2 id="ringTitle" style="margin:16px 0 8px;">闹钟响铃中</h2>
    <p id="ringBody" style="opacity:0.9; margin-bottom:28px;">时间到了！</p>
    <button class="btn" id="stopRingBtn" style="background:#fff; color:#dc2626; font-size:18px; padding:14px 36px; border-radius:30px;">🔕 关闭闹钟</button>
  </div>

  <!-- 底部导航栏 -->
  <nav>
    <button class="active" data-tab="schedule" data-title="📅 我的课表"><span class="ico">📅</span>课表</button>
    <button data-tab="exams" data-title="📝 考试计划"><span class="ico">📝</span>考试</button>
    <button data-tab="files" data-title="📁 图文资料库"><span class="ico">📁</span>资料</button>
    <button data-tab="music" data-title="🎵 放松音乐"><span class="ico">🎵</span>音乐</button>
    <button data-tab="stocks" data-title="🌍 全球股市"><span class="ico">📈</span>股市</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
