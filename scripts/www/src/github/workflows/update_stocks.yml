name: Update Global Stocks & News

on:
  schedule:
    # UTC 00:30 = 北京时间 08:30（亚太开盘前/美股收盘后）
    # UTC 14:30 = 北京时间 22:30（美股开盘后）
    - cron: '30 0,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yfinance
        run: pip install --upgrade yfinance

      - name: Fetch global market & daily news
        run: python scripts/fetch_stocks.py

      - name: Commit & push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_data.json
          git diff --staged --quiet || git commit -m "chore: update daily global stocks & news"
          git push
