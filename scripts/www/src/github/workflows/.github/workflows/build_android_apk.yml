name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & bundle JS
        run: |
          npm install
          npm run build

      - name: Generate Android project & inject alarm permissions
        run: |
          npx cap add android
          python3 - << 'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              xml = f.read()
          perms = """
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
          """
          if "SCHEDULE_EXACT_ALARM" not in xml:
              xml = xml.replace("<application", perms + "\n    <application", 1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(xml)
          EOF
          npx cap sync android

      - name: Compile Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyStockApp-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
