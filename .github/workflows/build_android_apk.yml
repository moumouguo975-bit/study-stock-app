name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & bundle JS
        run: |
          npm install
          npm run build

      - name: Generate Android project & inject MusicService + RapidOCR/Umi-OCR Dual Engine
        run: |
          npx cap add android
          python3 - << 'EOF'
          import os
          import re
          import wave
          import struct
          import math
          import textwrap

          # 1. 生成 15 秒真实响铃音频 alarm_ring.wav
          raw_dir = "android/app/src/main/res/raw"
          os.makedirs(raw_dir, exist_ok=True)
          sr = 22050
          dur = 15.0
          with wave.open(os.path.join(raw_dir, "alarm_ring.wav"), "w") as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(sr)
              frames = bytearray()
              for i in range(int(sr * dur)):
                  t = i / sr
                  cycle = t % 1.0
                  if cycle < 0.16 or (0.24 < cycle < 0.40) or (0.48 < cycle < 0.64):
                      freq = 1046.5 if cycle < 0.40 else 1318.5
                      val = int(26000 * math.sin(2 * math.pi * freq * t))
                  else:
                      val = 0
                  frames += struct.pack("<h", val)
              wf.writeframes(frames)

          # 2. 设置 minSdkVersion = 29（RapidOCR4j-Android 要求 minSdk >= 29）
          vars_path = "android/variables.gradle"
          if os.path.exists(vars_path):
              with open(vars_path, "r", encoding="utf-8") as f:
                  vg = f.read()
              vg = re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = 29", vg)
              with open(vars_path, "w", encoding="utf-8") as f:
                  f.write(vg)

          # 3. 注入 RapidOCR4j-Android（Umi-OCR 同源 RapidOCR / PP-OCR 离线引擎）并精简真机 ABI
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              gradle = f.read()
          dep = "    implementation 'io.github.hzkitty:rapidocr4j-android:1.0.0'\n"
          if "rapidocr4j-android" not in gradle:
              gradle = gradle.replace("dependencies {\n", "dependencies {\n" + dep, 1)
          abi_block = "        ndk {\n            abiFilters 'arm64-v8a', 'armeabi-v7a'\n        }\n"
          if "abiFilters" not in gradle and "defaultConfig {\n" in gradle:
              gradle = gradle.replace("defaultConfig {\n", "defaultConfig {\n" + abi_block, 1)
          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(gradle)

          # 4. 写入权限、tools:replace="android:theme"、明文HTTP与前台音乐服务
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              xml = f.read()
          if "xmlns:tools" not in xml:
              xml = xml.replace(
                  'xmlns:android="http://schemas.android.com/apk/res/android"',
                  'xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools"',
                  1
              )
          perms = """
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          """
          if "FOREGROUND_SERVICE_MEDIA_PLAYBACK" not in xml:
              xml = xml.replace("<application", perms + "\n    <application", 1)
          if "usesCleartextTraffic" not in xml:
              xml = xml.replace("<application", '<application android:usesCleartextTraffic="true" tools:replace="android:theme"', 1)
          elif "tools:replace" not in xml:
              xml = xml.replace("<application", '<application tools:replace="android:theme"', 1)
          service_decl = """
              <service
                  android:name=".MusicService"
                  android:exported="false"
                  android:foregroundServiceType="mediaPlayback" />
          """
          if ".MusicService" not in xml:
              xml = xml.replace("</application>", service_decl + "\n    </application>", 1)
          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(xml)

          java_dir = "android/app/src/main/java/com/personal/studyhub"
          os.makedirs(java_dir, exist_ok=True)

          # 5. MusicService.java（零拷贝直读 + MusicFree 自定义 Headers 流媒体）
          music_service_code = textwrap.dedent(r'''
              package com.personal.studyhub;

              import android.app.Notification;
              import android.app.NotificationChannel;
              import android.app.NotificationManager;
              import android.app.PendingIntent;
              import android.app.Service;
              import android.content.Intent;
              import android.content.pm.ServiceInfo;
              import android.media.AudioAttributes;
              import android.media.MediaPlayer;
              import android.media.PlaybackParams;
              import android.media.audiofx.BassBoost;
              import android.media.audiofx.Equalizer;
              import android.net.Uri;
              import android.os.Build;
              import android.os.IBinder;
              import android.os.PowerManager;
              import java.util.ArrayList;
              import java.util.HashMap;
              import java.util.Iterator;
              import java.util.Map;
              import java.util.Random;
              import org.json.JSONObject;

              public class MusicService extends Service {
                  public static MusicService instance;
                  public static final String CHANNEL_ID = "studyhub_music_bg";
                  public static final int NOTIF_ID = 10086;

                  public static ArrayList<String> paths = new ArrayList<>();
                  public static ArrayList<String> titles = new ArrayList<>();
                  public static ArrayList<String> formats = new ArrayList<>();
                  public static ArrayList<String> headersList = new ArrayList<>();
                  public static int currentIndex = -1;
                  public static String loopMode = "list";
                  public static float playSpeed = 1.0f;
                  public static int eqBass = 0;
                  public static int eqMid = 0;
                  public static int eqTreble = 0;
                  public static String keepAliveTitle = "";

                  private MediaPlayer player;
                  private Equalizer equalizer;
                  private BassBoost bassBoost;
                  private boolean isPrepared = false;
                  private final Random rng = new Random();

                  @Override
                  public void onCreate() {
                      super.onCreate();
                      instance = this;
                      createChannel();
                  }

                  @Override
                  public int onStartCommand(Intent intent, int flags, int startId) {
                      String action = intent != null ? intent.getAction() : "";
                      String title = getCurrentTitle();
                      if (title.isEmpty()) {
                          title = !keepAliveTitle.isEmpty() ? keepAliveTitle : "学财助手后台音频";
                      }
                      startForegroundCompat(title, "后台流畅播放中");

                      if ("ACTION_PLAY_LIST".equals(action)) {
                          playIndex(currentIndex);
                      } else if ("ACTION_KEEP_ALIVE".equals(action)) {
                          updateNotification(keepAliveTitle.isEmpty() ? "助眠白噪音" : keepAliveTitle, "后台运行中");
                      } else if ("ACTION_STOP_ALL".equals(action)) {
                          releasePlayer();
                          stopForeground(true);
                          stopSelf();
                      }
                      return START_STICKY;
                  }

                  private void createChannel() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel ch = new NotificationChannel(
                              CHANNEL_ID, "后台音乐播放", NotificationManager.IMPORTANCE_LOW
                          );
                          ch.setSound(null, null);
                          NotificationManager nm = getSystemService(NotificationManager.class);
                          if (nm != null) nm.createNotificationChannel(ch);
                      }
                  }

                  private Notification buildNotif(String title, String sub) {
                      Intent openIntent = new Intent(this, MainActivity.class);
                      openIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      int piFlags = Build.VERSION.SDK_INT >= 23
                          ? PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                          : PendingIntent.FLAG_UPDATE_CURRENT;
                      PendingIntent pi = PendingIntent.getActivity(this, 0, openIntent, piFlags);

                      Notification.Builder b = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? new Notification.Builder(this, CHANNEL_ID)
                          : new Notification.Builder(this);
                      return b.setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentTitle("🎵 " + title)
                          .setContentText(sub)
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .build();
                  }

                  private void startForegroundCompat(String title, String sub) {
                      try {
                          Notification n = buildNotif(title, sub);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                          } else {
                              startForeground(NOTIF_ID, n);
                          }
                      } catch (Exception ignored) {}
                  }

                  private void updateNotification(String title, String sub) {
                      try {
                          NotificationManager nm = getSystemService(NotificationManager.class);
                          if (nm != null) nm.notify(NOTIF_ID, buildNotif(title, sub));
                      } catch (Exception ignored) {}
                  }

                  private Map<String, String> parseHeadersAt(int idx) {
                      Map<String, String> map = new HashMap<>();
                      if (idx >= 0 && idx < headersList.size()) {
                          String raw = headersList.get(idx);
                          if (raw != null && !raw.isEmpty() && !"{}".equals(raw)) {
                              try {
                                  JSONObject obj = new JSONObject(raw);
                                  Iterator<String> it = obj.keys();
                                  while (it.hasNext()) {
                                      String k = it.next();
                                      String v = obj.optString(k, "");
                                      if (!v.isEmpty()) map.put(k, v);
                                  }
                              } catch (Exception ignored) {}
                          }
                      }
                      return map;
                  }

                  public synchronized void playIndex(int idx) {
                      if (paths.isEmpty() || idx < 0 || idx >= paths.size()) return;
                      currentIndex = idx;
                      String source = paths.get(idx);
                      String title = getCurrentTitle();
                      releasePlayer();
                      try {
                          player = new MediaPlayer();
                          player.setWakeMode(getApplicationContext(), PowerManager.PARTIAL_WAKE_LOCK);
                          player.setAudioAttributes(
                              new AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .build()
                          );
                          if (source.startsWith("content://")) {
                              player.setDataSource(getApplicationContext(), Uri.parse(source));
                          } else if (source.startsWith("http://") || source.startsWith("https://")) {
                              Map<String, String> hdrs = parseHeadersAt(idx);
                              if (!hdrs.isEmpty()) {
                                  player.setDataSource(getApplicationContext(), Uri.parse(source), hdrs);
                              } else {
                                  player.setDataSource(source);
                              }
                          } else {
                              player.setDataSource(source);
                          }
                          player.setOnPreparedListener(mp -> {
                              isPrepared = true;
                              attachAudioEffects(mp.getAudioSessionId());
                              applySpeed(playSpeed);
                              mp.start();
                              updateNotification(title, "正在后台流畅播放");
                          });
                          player.setOnErrorListener((mp, what, extra) -> true);
                          player.setOnCompletionListener(mp -> {
                              if (paths.isEmpty()) return;
                              int next = currentIndex;
                              if ("single".equals(loopMode)) {
                                  next = currentIndex;
                              } else if ("shuffle".equals(loopMode)) {
                                  next = rng.nextInt(paths.size());
                              } else {
                                  next = (currentIndex + 1) % paths.size();
                              }
                              playIndex(next);
                          });
                          player.prepareAsync();
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }

                  private void attachAudioEffects(int sessionId) {
                      try {
                          if (equalizer != null) equalizer.release();
                          equalizer = new Equalizer(0, sessionId);
                          equalizer.setEnabled(true);
                      } catch (Exception ignored) { equalizer = null; }
                      try {
                          if (bassBoost != null) bassBoost.release();
                          bassBoost = new BassBoost(0, sessionId);
                          bassBoost.setEnabled(true);
                      } catch (Exception ignored) { bassBoost = null; }
                      applyEq(eqBass, eqMid, eqTreble);
                  }

                  public synchronized void applyEq(int bass, int mid, int treble) {
                      eqBass = bass; eqMid = mid; eqTreble = treble;
                      try {
                          if (equalizer != null) {
                              short numBands = equalizer.getNumberOfBands();
                              short[] range = equalizer.getBandLevelRange();
                              for (short b = 0; b < numBands; b++) {
                                  int db = (b == 0) ? bass : (b == numBands - 1 ? treble : mid);
                                  short lv = (short) Math.max(range[0], Math.min(range[1], db * 100));
                                  equalizer.setBandLevel(b, lv);
                              }
                          }
                      } catch (Exception ignored) {}
                      try {
                          if (bassBoost != null && bassBoost.getStrengthSupported()) {
                              short st = (short) Math.max(0, Math.min(1000, bass > 0 ? bass * 85 : 0));
                              bassBoost.setStrength(st);
                          }
                      } catch (Exception ignored) {}
                  }

                  public synchronized void applySpeed(float sp) {
                      playSpeed = sp;
                      try {
                          if (player != null && isPrepared && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              PlaybackParams pp = player.getPlaybackParams();
                              pp.setSpeed(sp);
                              player.setPlaybackParams(pp);
                          }
                      } catch (Exception ignored) {}
                  }

                  public synchronized void pause() { if (player != null && isPrepared && player.isPlaying()) { player.pause(); updateNotification(getCurrentTitle(), "已暂停"); } }
                  public synchronized void resume() { if (player != null && isPrepared && !player.isPlaying()) { player.start(); updateNotification(getCurrentTitle(), "正在后台流畅播放"); } }
                  public synchronized void seekTo(int ms) { if (player != null && isPrepared) player.seekTo(ms); }
                  public synchronized boolean isPlaying() { return player != null && isPrepared && player.isPlaying(); }
                  public synchronized int getCurrentMs() { return (player != null && isPrepared) ? player.getCurrentPosition() : 0; }
                  public synchronized int getDurationMs() { return (player != null && isPrepared) ? player.getDuration() : 0; }
                  public synchronized String getCurrentTitle() { return (currentIndex >= 0 && currentIndex < titles.size()) ? titles.get(currentIndex) : ""; }
                  public synchronized String getCurrentFormat() { return (currentIndex >= 0 && currentIndex < formats.size()) ? formats.get(currentIndex) : "AUDIO"; }

                  private void releasePlayer() {
                      isPrepared = false;
                      try { if (equalizer != null) { equalizer.release(); equalizer = null; } } catch (Exception ignored) {}
                      try { if (bassBoost != null) { bassBoost.release(); bassBoost = null; } } catch (Exception ignored) {}
                      try { if (player != null) { player.stop(); player.release(); player = null; } } catch (Exception ignored) {}
                  }

                  @Override
                  public void onDestroy() { releasePlayer(); instance = null; super.onDestroy(); }
                  @Override
                  public IBinder onBind(Intent intent) { return null; }
              }
          ''').lstrip()

          with open(os.path.join(java_dir, "MusicService.java"), "w", encoding="utf-8") as f:
              f.write(music_service_code)

          # 6. NativeToolsPlugin.java（内置 RapidOCR 离线识别 + 远程 Umi-OCR Base64 双模 + 零拷贝音乐 + TTS/闹钟/日历）
          plugin_code = textwrap.dedent(r'''
              package com.personal.studyhub;

              import android.Manifest;
              import android.app.Activity;
              import android.content.ClipData;
              import android.content.Intent;
              import android.content.pm.PackageManager;
              import android.database.Cursor;
              import android.graphics.Bitmap;
              import android.graphics.BitmapFactory;
              import android.graphics.Canvas;
              import android.graphics.Color;
              import android.graphics.pdf.PdfRenderer;
              import android.location.Location;
              import android.location.LocationManager;
              import android.net.Uri;
              import android.os.ParcelFileDescriptor;
              import android.provider.AlarmClock;
              import android.provider.CalendarContract;
              import android.provider.OpenableColumns;
              import android.speech.tts.TextToSpeech;
              import android.speech.tts.UtteranceProgressListener;
              import android.util.Base64;
              import android.webkit.MimeTypeMap;
              import androidx.activity.result.ActivityResult;
              import androidx.core.content.ContextCompat;
              import com.getcapacitor.JSArray;
              import com.getcapacitor.JSObject;
              import com.getcapacitor.Plugin;
              import com.getcapacitor.PluginCall;
              import com.getcapacitor.PluginMethod;
              import com.getcapacitor.annotation.ActivityCallback;
              import com.getcapacitor.annotation.CapacitorPlugin;
              import io.github.hzkitty.RapidOCR;
              import io.github.hzkitty.entity.OcrResult;
              import java.io.BufferedReader;
              import java.io.ByteArrayOutputStream;
              import java.io.File;
              import java.io.FileInputStream;
              import java.io.FileOutputStream;
              import java.io.InputStream;
              import java.io.InputStreamReader;
              import java.lang.reflect.Method;
              import java.nio.charset.StandardCharsets;
              import java.util.ArrayList;
              import java.util.List;
              import java.util.Locale;
              import java.util.concurrent.ExecutorService;
              import java.util.concurrent.Executors;
              import java.util.zip.ZipEntry;
              import java.util.zip.ZipInputStream;
              import org.json.JSONException;

              @CapacitorPlugin(name = "NativeTools")
              public class NativeToolsPlugin extends Plugin {
                  private static RapidOCR sharedRapidOcr = null;
                  private static final Object OCR_LOCK = new Object();
                  private final ExecutorService ocrExecutor = Executors.newSingleThreadExecutor();
                  private TextToSpeech tts;
                  private boolean ttsReady = false;

                  private RapidOCR getOrInitRapidOcr() throws Exception {
                      synchronized (OCR_LOCK) {
                          if (sharedRapidOcr == null) {
                              sharedRapidOcr = RapidOCR.create(getContext().getApplicationContext());
                          }
                          return sharedRapidOcr;
                      }
                  }

                  private String parseOcrResultText(OcrResult res) {
                      if (res == null) return "";
                      try {
                          Method m = res.getClass().getMethod("getStrRes");
                          Object v = m.invoke(res);
                          if (v != null && !String.valueOf(v).trim().isEmpty()) {
                              return String.valueOf(v).trim();
                          }
                      } catch (Exception ignored) {}
                      try {
                          Method m = res.getClass().getMethod("getRecRes");
                          Object listObj = m.invoke(res);
                          if (listObj instanceof List) {
                              StringBuilder sb = new StringBuilder();
                              for (Object item : (List<?>) listObj) {
                                  if (item == null) continue;
                                  try {
                                      Method gm = item.getClass().getMethod("getText");
                                      Object t = gm.invoke(item);
                                      if (t != null && !String.valueOf(t).trim().isEmpty()) {
                                          sb.append(String.valueOf(t).trim()).append("\n");
                                      }
                                  } catch (Exception ignored2) {}
                              }
                              String out = sb.toString().trim();
                              if (!out.isEmpty()) return out;
                          }
                      } catch (Exception ignored) {}
                      return res.toString() != null ? res.toString().trim() : "";
                  }

                  @PluginMethod
                  public void testLocalOcr(PluginCall call) {
                      ocrExecutor.execute(() -> {
                          try {
                              getOrInitRapidOcr();
                              JSObject ret = new JSObject();
                              ret.put("ok", true);
                              ret.put("engine", "RapidOCR4j-Android (Umi-OCR 同源 PP-OCR ONNX 离线引擎)");
                              call.resolve(ret);
                          } catch (Throwable e) {
                              call.reject("本机 RapidOCR 引擎初始化失败: " + e.getMessage());
                          }
                      });
                  }

                  private Locale mapLangToLocale(String lang) {
                      if ("en".equals(lang)) return Locale.US;
                      if ("ja".equals(lang)) return Locale.JAPAN;
                      if ("ko".equals(lang)) return Locale.KOREA;
                      if ("fr".equals(lang)) return Locale.FRANCE;
                      if ("de".equals(lang)) return Locale.GERMANY;
                      if ("es".equals(lang)) return new Locale("es");
                      if ("ru".equals(lang)) return new Locale("ru");
                      return Locale.SIMPLIFIED_CHINESE;
                  }

                  private void withTtsReady(Runnable action, PluginCall call) {
                      if (tts != null && ttsReady) { action.run(); }
                      else {
                          tts = new TextToSpeech(getContext(), status -> {
                              if (status == TextToSpeech.SUCCESS) { ttsReady = true; action.run(); }
                              else call.reject("设备未安装语音朗读引擎");
                          });
                      }
                  }

                  @PluginMethod
                  public void speakText(PluginCall call) {
                      String text = call.getString("text", ""), lang = call.getString("lang", "zh-CN");
                      if (text.isEmpty()) { call.resolve(); return; }
                      withTtsReady(() -> {
                          try {
                              tts.setOnUtteranceProgressListener(null);
                              tts.setLanguage(mapLangToLocale(lang));
                              tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "single_tts");
                              call.resolve();
                          } catch (Exception e) { call.reject(e.getMessage()); }
                      }, call);
                  }

                  @PluginMethod
                  public void speakPair(PluginCall call) {
                      String text1 = call.getString("text1", ""), lang1 = call.getString("lang1", "en");
                      String text2 = call.getString("text2", ""), lang2 = call.getString("lang2", "zh-CN");
                      if (text1.isEmpty() && text2.isEmpty()) { call.resolve(); return; }
                      withTtsReady(() -> {
                          try {
                              tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                                  @Override public void onStart(String id) {}
                                  @Override public void onError(String id) {}
                                  @Override public void onDone(String id) {
                                      if ("pair_1".equals(id) && !text2.isEmpty()) {
                                          try { Thread.sleep(220); tts.setLanguage(mapLangToLocale(lang2)); tts.speak(text2, TextToSpeech.QUEUE_FLUSH, null, "pair_2"); }
                                          catch (Exception ignored) {}
                                      }
                                  }
                              });
                              tts.setLanguage(mapLangToLocale(lang1));
                              tts.speak(text1, TextToSpeech.QUEUE_FLUSH, null, "pair_1");
                              call.resolve();
                          } catch (Exception e) { call.reject(e.getMessage()); }
                      }, call);
                  }

                  @PluginMethod
                  public void getDeviceLocation(PluginCall call) {
                      try {
                          boolean hasCoarse = ContextCompat.checkSelfPermission(getContext(), Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                          boolean hasFine = ContextCompat.checkSelfPermission(getContext(), Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                          if (!hasCoarse && !hasFine) { call.reject("未授予设备定位权限"); return; }
                          LocationManager lm = (LocationManager) getContext().getSystemService(android.content.Context.LOCATION_SERVICE);
                          if (lm == null) { call.reject("无定位服务"); return; }
                          Location loc = null;
                          for (String provider : lm.getProviders(true)) {
                              Location l = lm.getLastKnownLocation(provider);
                              if (l != null && (loc == null || l.getAccuracy() < loc.getAccuracy())) loc = l;
                          }
                          if (loc == null) { call.reject("暂无缓存定位"); return; }
                          JSObject ret = new JSObject(); ret.put("lat", loc.getLatitude()); ret.put("lon", loc.getLongitude()); call.resolve(ret);
                      } catch (Exception e) { call.reject(e.getMessage()); }
                  }

                  @PluginMethod
                  public void pickAudioRefs(PluginCall call) {
                      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                      intent.setType("audio/*");
                      intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, Boolean.TRUE.equals(call.getBoolean("multiple", true)));
                      intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                      startActivityForResult(call, intent, "onPickAudioRefsResult");
                  }

                  @ActivityCallback
                  private void onPickAudioRefsResult(PluginCall call, ActivityResult result) {
                      if (call == null) return;
                      if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null) { call.reject("已取消选择"); return; }
                      Intent data = result.getData();
                      ArrayList<Uri> uris = new ArrayList<>();
                      ClipData clip = data.getClipData();
                      if (clip != null) { for (int i = 0; i < clip.getItemCount(); i++) uris.add(clip.getItemAt(i).getUri()); }
                      else if (data.getData() != null) uris.add(data.getData());

                      JSArray arr = new JSArray();
                      for (Uri uri : uris) {
                          try {
                              try { getContext().getContentResolver().takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION); } catch (Exception ignored) {}
                              String name = queryDisplayName(uri);
                              long size = queryFileSize(uri);
                              String mime = getContext().getContentResolver().getType(uri);
                              if (mime == null) mime = "audio/mpeg";
                              String ext = "";
                              int dot = name.lastIndexOf('.');
                              if (dot > 0 && dot < name.length() - 1) ext = name.substring(dot + 1).toLowerCase(Locale.ROOT);
                              else { String g = MimeTypeMap.getSingleton().getExtensionFromMimeType(mime); if (g != null) ext = g.toLowerCase(Locale.ROOT); }
                              JSObject obj = new JSObject();
                              obj.put("name", name); obj.put("format", ext.isEmpty() ? "AUDIO" : ext.toUpperCase(Locale.ROOT));
                              obj.put("mime", mime); obj.put("size", size); obj.put("uri", uri.toString());
                              arr.put(obj);
                          } catch (Exception e) { e.printStackTrace(); }
                      }
                      JSObject ret = new JSObject(); ret.put("files", arr); call.resolve(ret);
                  }

                  @PluginMethod
                  public void audioPlayList(PluginCall call) {
                      try {
                          updateStaticLists(call);
                          MusicService.currentIndex = call.getInt("index", 0);
                          MusicService.loopMode = call.getString("loopMode", "list");
                          MusicService.playSpeed = call.getFloat("speed", 1.0f);
                          MusicService.eqBass = call.getInt("bass", 0);
                          MusicService.eqMid = call.getInt("mid", 0);
                          MusicService.eqTreble = call.getInt("treble", 0);
                          Intent intent = new Intent(getContext(), MusicService.class);
                          intent.setAction("ACTION_PLAY_LIST");
                          ContextCompat.startForegroundService(getContext(), intent);
                          call.resolve();
                      } catch (Exception e) { call.reject(e.getMessage()); }
                  }

                  @PluginMethod
                  public void audioUpdatePlaylist(PluginCall call) {
                      try { updateStaticLists(call); call.resolve(); } catch (Exception e) { call.reject(e.getMessage()); }
                  }

                  private void updateStaticLists(PluginCall call) throws JSONException {
                      JSArray pArr = call.getArray("paths"), tArr = call.getArray("titles"), fArr = call.getArray("formats"), hArr = call.getArray("headers");
                      ArrayList<String> ps = new ArrayList<>(), ts = new ArrayList<>(), fs = new ArrayList<>(), hs = new ArrayList<>();
                      if (pArr != null) for (int i = 0; i < pArr.length(); i++) ps.add(pArr.getString(i));
                      if (tArr != null) for (int i = 0; i < tArr.length(); i++) ts.add(tArr.getString(i));
                      if (fArr != null) for (int i = 0; i < fArr.length(); i++) fs.add(fArr.getString(i));
                      if (hArr != null) for (int i = 0; i < hArr.length(); i++) hs.add(hArr.optString(i, "{}"));
                      MusicService.paths = ps; MusicService.titles = ts; MusicService.formats = fs; MusicService.headersList = hs;
                  }

                  @PluginMethod public void audioPause(PluginCall call) { if (MusicService.instance != null) MusicService.instance.pause(); call.resolve(); }
                  @PluginMethod public void audioResume(PluginCall call) { if (MusicService.instance != null) MusicService.instance.resume(); call.resolve(); }
                  @PluginMethod public void audioSeek(PluginCall call) { if (MusicService.instance != null) MusicService.instance.seekTo(call.getInt("positionMs", 0)); call.resolve(); }
                  @PluginMethod public void audioSetSpeed(PluginCall call) { float sp = call.getFloat("speed", 1.0f); MusicService.playSpeed = sp; if (MusicService.instance != null) MusicService.instance.applySpeed(sp); call.resolve(); }
                  @PluginMethod public void audioSetLoopMode(PluginCall call) { MusicService.loopMode = call.getString("loopMode", "list"); call.resolve(); }
                  @PluginMethod public void audioSetEq(PluginCall call) { int b = call.getInt("bass", 0), m = call.getInt("mid", 0), t = call.getInt("treble", 0); MusicService.eqBass = b; MusicService.eqMid = m; MusicService.eqTreble = t; if (MusicService.instance != null) MusicService.instance.applyEq(b, m, t); call.resolve(); }
                  @PluginMethod public void audioStop(PluginCall call) { Intent i = new Intent(getContext(), MusicService.class); i.setAction("ACTION_STOP_ALL"); getContext().startService(i); call.resolve(); }
                  @PluginMethod public void setKeepAlive(PluginCall call) {
                      boolean active = Boolean.TRUE.equals(call.getBoolean("active", false));
                      MusicService.keepAliveTitle = call.getString("title", "白噪音");
                      Intent i = new Intent(getContext(), MusicService.class);
                      i.setAction(active ? "ACTION_KEEP_ALIVE" : "ACTION_STOP_ALL");
                      if (active) ContextCompat.startForegroundService(getContext(), i);
                      else if (MusicService.instance != null && !MusicService.instance.isPlaying()) getContext().startService(i);
                      call.resolve();
                  }
                  @PluginMethod public void audioGetStatus(PluginCall call) {
                      JSObject ret = new JSObject();
                      ret.put("playing", MusicService.instance != null && MusicService.instance.isPlaying());
                      ret.put("currentMs", MusicService.instance != null ? MusicService.instance.getCurrentMs() : 0);
                      ret.put("durationMs", MusicService.instance != null ? MusicService.instance.getDurationMs() : 0);
                      ret.put("index", MusicService.currentIndex);
                      ret.put("title", MusicService.instance != null ? MusicService.instance.getCurrentTitle() : "");
                      ret.put("format", MusicService.instance != null ? MusicService.instance.getCurrentFormat() : "AUDIO");
                      call.resolve(ret);
                  }

                  @PluginMethod
                  public void pickFiles(PluginCall call) {
                      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                      intent.setType(call.getString("accept", "*/*"));
                      intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, Boolean.TRUE.equals(call.getBoolean("multiple", false)));
                      startActivityForResult(call, intent, "onPickFilesResult");
                  }

                  @ActivityCallback
                  private void onPickFilesResult(PluginCall call, ActivityResult result) {
                      if (call == null) return;
                      if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null) { call.reject("已取消选择"); return; }
                      Intent data = result.getData();
                      ArrayList<Uri> uris = new ArrayList<>();
                      ClipData clip = data.getClipData();
                      if (clip != null) { for (int i = 0; i < clip.getItemCount(); i++) uris.add(clip.getItemAt(i).getUri()); }
                      else if (data.getData() != null) uris.add(data.getData());

                      File dir = new File(getContext().getFilesDir(), "imported");
                      if (!dir.exists()) dir.mkdirs();
                      JSArray arr = new JSArray();
                      for (Uri uri : uris) {
                          try {
                              String name = queryDisplayName(uri), mime = getContext().getContentResolver().getType(uri);
                              if (mime == null) mime = "application/octet-stream";
                              String ext = ""; int dot = name.lastIndexOf('.');
                              if (dot > 0 && dot < name.length() - 1) ext = name.substring(dot + 1).toLowerCase(Locale.ROOT);
                              else { String g = MimeTypeMap.getSingleton().getExtensionFromMimeType(mime); if (g != null) { ext = g.toLowerCase(Locale.ROOT); name = name + "." + ext; } }
                              File dest = new File(dir, System.currentTimeMillis() + "_" + name.replaceAll("[^a-zA-Z0-9._-]", "_"));
                              long totalBytes = 0;
                              try (InputStream in = getContext().getContentResolver().openInputStream(uri); FileOutputStream out = new FileOutputStream(dest)) {
                                  if (in == null) continue;
                                  byte[] buf = new byte[16384]; int len;
                                  while ((len = in.read(buf)) > 0) { out.write(buf, 0, len); totalBytes += len; }
                              }
                              JSObject obj = new JSObject();
                              obj.put("name", name); obj.put("format", ext.isEmpty() ? "FILE" : ext.toUpperCase(Locale.ROOT));
                              obj.put("mime", mime); obj.put("size", totalBytes); obj.put("localPath", dest.getAbsolutePath());
                              arr.put(obj);
                          } catch (Exception e) { e.printStackTrace(); }
                      }
                      JSObject ret = new JSObject(); ret.put("files", arr); call.resolve(ret);
                  }

                  private String queryDisplayName(Uri uri) {
                      String name = "file_" + System.currentTimeMillis();
                      try (Cursor c = getContext().getContentResolver().query(uri, null, null, null, null)) {
                          if (c != null && c.moveToFirst()) {
                              int idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                              if (idx >= 0) { String n = c.getString(idx); if (n != null && !n.trim().isEmpty()) name = n.trim(); }
                          }
                      } catch (Exception ignored) {}
                      return name;
                  }

                  private long queryFileSize(Uri uri) {
                      try (Cursor c = getContext().getContentResolver().query(uri, null, null, null, null)) {
                          if (c != null && c.moveToFirst()) {
                              int idx = c.getColumnIndex(OpenableColumns.SIZE);
                              if (idx >= 0 && !c.isNull(idx)) return c.getLong(idx);
                          }
                      } catch (Exception ignored) {}
                      return 0;
                  }

                  @PluginMethod
                  public void deleteLocalFile(PluginCall call) {
                      String p = call.getString("localPath", "");
                      if (!p.isEmpty()) { File f = new File(p); if (f.exists()) f.delete(); }
                      call.resolve();
                  }

                  // 双模 OCR：mode="local" 时直接用本机 RapidOCR（Umi-OCR 同源引擎）离线识别；mode="remote" 返回 Base64 供远程 Umi-OCR 识别
                  @PluginMethod
                  public void extractText(PluginCall call) {
                      String path = call.getString("localPath", "");
                      String mode = call.getString("mode", "local");
                      int maxPages = call.getInt("maxPages", 3);
                      File file = new File(path);
                      if (path.isEmpty() || !file.exists()) { call.reject("文件不存在"); return; }
                      String lower = file.getName().toLowerCase(Locale.ROOT);

                      ocrExecutor.execute(() -> {
                          try {
                              if (lower.endsWith(".txt") || lower.endsWith(".csv") || lower.endsWith(".md") || lower.endsWith(".json") || lower.endsWith(".js")) {
                                  StringBuilder sb = new StringBuilder();
                                  try (BufferedReader br = new BufferedReader(new InputStreamReader(new FileInputStream(file), StandardCharsets.UTF_8))) {
                                      String line; while ((line = br.readLine()) != null) sb.append(line).append("\n");
                                  }
                                  JSObject ret = new JSObject(); ret.put("text", sb.toString()); ret.put("needsOcr", false); call.resolve(ret); return;
                              }
                              if (lower.endsWith(".docx") || lower.endsWith(".xlsx") || lower.endsWith(".pptx")) {
                                  JSObject ret = new JSObject(); ret.put("text", extractOfficeXmlText(file)); ret.put("needsOcr", false); call.resolve(ret); return;
                              }

                              if ("remote".equals(mode)) {
                                  JSArray imgs = lower.endsWith(".pdf")
                                      ? renderPdfToBase64List(file, Math.max(1, Math.min(10, maxPages)))
                                      : singleImageBase64Array(file);
                                  JSObject ret = new JSObject(); ret.put("needsOcr", true); ret.put("images", imgs); call.resolve(ret); return;
                              }

                              // 本机离线 RapidOCR（Umi-OCR 同源引擎）直接识别图片或 PDF
                              RapidOCR ocr = getOrInitRapidOcr();
                              if (lower.endsWith(".pdf")) {
                                  String pdfText = runLocalOcrOnPdf(ocr, file, Math.max(1, Math.min(10, maxPages)));
                                  JSObject ret = new JSObject(); ret.put("text", pdfText); ret.put("needsOcr", false); ret.put("engine", "rapidocr-local"); call.resolve(ret); return;
                              }
                              Bitmap bmp = decodeScaledBitmap(file);
                              if (bmp == null) { call.reject("无法解码该图片文件"); return; }
                              try {
                                  OcrResult ocrRes = ocr.run(bmp);
                                  JSObject ret = new JSObject();
                                  ret.put("text", parseOcrResultText(ocrRes));
                                  ret.put("needsOcr", false);
                                  ret.put("engine", "rapidocr-local");
                                  call.resolve(ret);
                              } finally {
                                  bmp.recycle();
                              }
                          } catch (Throwable e) {
                              call.reject("OCR 识别失败: " + e.getMessage());
                          }
                      });
                  }

                  private Bitmap decodeScaledBitmap(File file) {
                      BitmapFactory.Options bounds = new BitmapFactory.Options();
                      bounds.inJustDecodeBounds = true;
                      BitmapFactory.decodeFile(file.getAbsolutePath(), bounds);
                      int maxSide = Math.max(bounds.outWidth, bounds.outHeight);
                      BitmapFactory.Options opts = new BitmapFactory.Options();
                      int sample = 1;
                      while (maxSide / sample > 2000) sample *= 2;
                      opts.inSampleSize = sample;
                      return BitmapFactory.decodeFile(file.getAbsolutePath(), opts);
                  }

                  private String runLocalOcrOnPdf(RapidOCR ocr, File file, int maxPages) throws Exception {
                      StringBuilder sb = new StringBuilder();
                      ParcelFileDescriptor pfd = ParcelFileDescriptor.open(file, ParcelFileDescriptor.MODE_READ_ONLY);
                      PdfRenderer renderer = new PdfRenderer(pfd);
                      try {
                          int count = Math.min(renderer.getPageCount(), maxPages);
                          for (int i = 0; i < count; i++) {
                              PdfRenderer.Page page = renderer.openPage(i);
                              try {
                                  float scale = Math.min(2.0f, 1800f / Math.max(1, Math.max(page.getWidth(), page.getHeight())));
                                  Bitmap bmp = Bitmap.createBitmap(Math.max(1, Math.round(page.getWidth() * scale)), Math.max(1, Math.round(page.getHeight() * scale)), Bitmap.Config.ARGB_8888);
                                  try {
                                      Canvas canvas = new Canvas(bmp); canvas.drawColor(Color.WHITE);
                                      page.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY);
                                      String part = parseOcrResultText(ocr.run(bmp));
                                      if (!part.isEmpty()) sb.append(part).append("\n\n");
                                  } finally { bmp.recycle(); }
                              } finally { page.close(); }
                          }
                      } finally { renderer.close(); pfd.close(); }
                      return sb.toString().trim();
                  }

                  private String bitmapToBase64Jpeg(Bitmap bmp) {
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      bmp.compress(Bitmap.CompressFormat.JPEG, 88, baos);
                      return Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                  }

                  private JSArray singleImageBase64Array(File file) throws Exception {
                      Bitmap bmp = decodeScaledBitmap(file);
                      if (bmp == null) throw new Exception("无法解码该图片");
                      try { JSArray arr = new JSArray(); arr.put(bitmapToBase64Jpeg(bmp)); return arr; }
                      finally { bmp.recycle(); }
                  }

                  private JSArray renderPdfToBase64List(File file, int maxPages) throws Exception {
                      JSArray arr = new JSArray();
                      ParcelFileDescriptor pfd = ParcelFileDescriptor.open(file, ParcelFileDescriptor.MODE_READ_ONLY);
                      PdfRenderer renderer = new PdfRenderer(pfd);
                      try {
                          int count = Math.min(renderer.getPageCount(), maxPages);
                          if (count <= 0) throw new Exception("PDF 为空");
                          for (int i = 0; i < count; i++) {
                              PdfRenderer.Page page = renderer.openPage(i);
                              try {
                                  float scale = Math.min(2.0f, 1800f / Math.max(1, Math.max(page.getWidth(), page.getHeight())));
                                  Bitmap bmp = Bitmap.createBitmap(Math.max(1, Math.round(page.getWidth() * scale)), Math.max(1, Math.round(page.getHeight() * scale)), Bitmap.Config.ARGB_8888);
                                  try { Canvas canvas = new Canvas(bmp); canvas.drawColor(Color.WHITE); page.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY); arr.put(bitmapToBase64Jpeg(bmp)); }
                                  finally { bmp.recycle(); }
                              } finally { page.close(); }
                          }
                      } finally { renderer.close(); pfd.close(); }
                      return arr;
                  }

                  private String extractOfficeXmlText(File file) throws Exception {
                      StringBuilder sb = new StringBuilder();
                      try (ZipInputStream zis = new ZipInputStream(new FileInputStream(file))) {
                          ZipEntry entry;
                          while ((entry = zis.getNextEntry()) != null) {
                              String n = entry.getName();
                              if (n.equals("word/document.xml") || n.equals("xl/sharedStrings.xml") || (n.startsWith("ppt/slides/slide") && n.endsWith(".xml"))) {
                                  ByteArrayOutputStream baos = new ByteArrayOutputStream();
                                  byte[] buf = new byte[8192]; int len;
                                  while ((len = zis.read(buf)) > 0) baos.write(buf, 0, len);
                                  String xml = baos.toString("UTF-8").replaceAll("</w:p>|</a:p>|</si>|</row>", "\n").replaceAll("<[^>]+>", " ");
                                  sb.append(xml.replace("&amp;", "&").replace("&lt;", "<").replace("&gt;", ">").replace("&quot;", "\"")).append("\n");
                              }
                              zis.closeEntry();
                          }
                      }
                      return sb.toString().replaceAll("[ \\t]+", " ").replaceAll("\\n\\s*\\n+", "\n").trim();
                  }

                  @PluginMethod
                  public void setSystemAlarm(PluginCall call) {
                      Integer hour = call.getInt("hour"), minute = call.getInt("minute");
                      if (hour == null || minute == null) { call.reject("缺少时间"); return; }
                      Intent intent = new Intent(AlarmClock.ACTION_SET_ALARM);
                      intent.putExtra(AlarmClock.EXTRA_HOUR, hour); intent.putExtra(AlarmClock.EXTRA_MINUTES, minute);
                      intent.putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("message", "学财助手闹钟"));
                      intent.putExtra(AlarmClock.EXTRA_SKIP_UI, call.getBoolean("skipUi", false)); intent.putExtra(AlarmClock.EXTRA_VIBRATE, true);
                      JSArray daysArr = call.getArray("days");
                      if (daysArr != null && daysArr.length() > 0) {
                          ArrayList<Integer> days = new ArrayList<>();
                          for (int i = 0; i < daysArr.length(); i++) { try { days.add(daysArr.getInt(i)); } catch (JSONException ignored) {} }
                          if (!days.isEmpty()) intent.putIntegerArrayListExtra(AlarmClock.EXTRA_DAYS, days);
                      }
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      try { getContext().startActivity(intent); call.resolve(); } catch (Exception e) { call.reject(e.getMessage()); }
                  }

